[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-signage-toolkit"
version = "2.4.7"
description = "Professional GUI application for provisioning and maintaining Ubuntu Digital Signage Kiosks"
authors = [
    { name = "Southwestern CC IT", email = "it@southwesterncc.edu" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyQt6>=6.6.0",
    "psutil>=5.9.0",
    "qtawesome>=1.3.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/southwesterncc/digital-signage-toolkit"

[project.scripts]
digital-signage-toolkit = "digital_signage_toolkit.main:main"

[project.gui-scripts]
digital-signage-toolkit = "digital_signage_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["digital_signage_toolkit", "digital_signage_toolkit.*"]

[tool.setuptools.package-data]
digital_signage_toolkit = ["branding/*", "monitoring/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument
    "B905",  # zip without strict
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "C4"]
"__init__.py" = ["F401"]
