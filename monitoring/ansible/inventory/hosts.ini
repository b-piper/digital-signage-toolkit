# Digital Signage Toolkit - Ansible Inventory
# ============================================
# Edit this file to add your kiosks
#
# Format: hostname ansible_host=IP_ADDRESS
# 
# Example for SCC:
#   kiosk-library ansible_host=192.168.1.101
#   kiosk-cafeteria ansible_host=192.168.1.102

[kiosks]
# Add your kiosks here - one per line
# kiosk-library ansible_host=192.168.1.101
# kiosk-cafeteria ansible_host=192.168.1.102
# kiosk-gym ansible_host=192.168.1.103
# kiosk-admin ansible_host=192.168.1.104
# kiosk-main-entrance ansible_host=192.168.1.105
# kiosk-student-center ansible_host=192.168.1.106

[kiosks:vars]
# SSH connection settings
ansible_user=rise
ansible_become=yes
ansible_become_method=sudo

# Optional: If using SSH keys (recommended)
# ansible_ssh_private_key_file=~/.ssh/dst_key

# Optional: If still using password auth
# ansible_ssh_pass=YOUR_PASSWORD
# ansible_become_pass=YOUR_PASSWORD
